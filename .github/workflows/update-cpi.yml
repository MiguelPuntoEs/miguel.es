name: Update CPI data

on:
  schedule:
    # Quarterly: Jan/Apr/Jul/Oct 15th, 06:17 UTC (OECD revises annual CPI occasionally)
    - cron: "17 6 15 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest CPI data from OECD
        run: node scripts/update-cpi.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet public/cpi.json; then
            echo "CPI data unchanged, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/cpi.json
            git commit -m "chore: update CPI data from OECD"
            git push
          fi
